---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: earth-info-jukebox
  labels:
    app.kubernetes.io/name: earth-info-jukebox
    app.kubernetes.io/part-of: nasa-space-apps-2026
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: earth-info-jukebox
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: earth-info-jukebox
        app.kubernetes.io/part-of: nasa-space-apps-2026
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: earth-info-jukebox
          image: docker.io/fumbles/earth-info-jukebok:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: earth-info-jukebox
  labels:
    app.kubernetes.io/name: earth-info-jukebox
spec:
  selector:
    app.kubernetes.io/name: earth-info-jukebox
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: earth-info-jukebox
  labels:
    app.kubernetes.io/name: earth-info-jukebox
spec:
  to:
    kind: Service
    name: earth-info-jukebox
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

